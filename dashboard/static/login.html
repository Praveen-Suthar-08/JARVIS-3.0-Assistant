<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS 3.0 — Remote Authentication</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg:          #05070f;
      --bg-gradient: radial-gradient(circle at 50% 30%, #0d1527 0%, #05070f 80%);
      --card:        rgba(15, 23, 42, 0.7);
      --border:      rgba(56, 189, 248, 0.2);
      --border-glow: rgba(0, 242, 254, 0.4);
      --accent:      #00f2fe;
      --accent-grad: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --adim:        rgba(0, 242, 254, 0.15);
      --text:        #f1f5f9;
      --muted:       #64748b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .card {
      width: 380px;
      padding: 48px 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 242, 254, 0.1);
      position: relative;
      transition: box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(0, 242, 254, 0.18);
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 8px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo em {
      color: var(--accent);
      font-style: normal;
      -webkit-text-fill-color: initial;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.7);
    }

    .sub {
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 4px;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 14px;
      opacity: 0.9;
    }

    .hint {
      font-size: 12.5px;
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .key-wrap {
      position: relative;
      margin-bottom: 18px;
    }

    .key-input {
      width: 100%;
      padding: 18px 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      text-align: center;
      letter-spacing: 12px;
      text-transform: uppercase;
      outline: none;
      transition: all 0.25s ease;
      caret-color: var(--accent);
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .key-input::placeholder {
      color: rgba(100, 116, 139, 0.4);
      letter-spacing: 8px;
      font-size: 22px;
    }

    .key-input:focus {
      border-color: var(--accent);
      background: rgba(0, 242, 254, 0.05);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.3);
    }

    .err {
      font-size: 12.5px;
      font-weight: 600;
      color: #f87171;
      min-height: 20px;
      margin-bottom: 14px;
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: var(--accent-grad);
      color: #05070f;
      font-size: 12.5px;
      font-weight: 800;
      letter-spacing: 3px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.45);
    }

    .btn:active { transform: scale(0.97); }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    .shake { animation: shake 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

    .voice-note {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 24px;
      line-height: 1.6;
      text-align: left;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 18px;
    }

    .voice-note code {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      color: var(--text);
    }

    #reconnecting {
      display: none;
      color: var(--accent);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo"><em>J</em>ARVIS 3.0</div>
    <div class="sub">Remote Authentication</div>
    <p id="reconnecting">Reconnecting to session…</p>
    <p class="hint">Press <strong style="color:var(--text)">Remote Control</strong> in the JARVIS desktop app to get your passcode or QR link.</p>
    <div class="key-wrap">
      <input class="key-input" id="key" type="text" maxlength="6"
             autocomplete="off" autocorrect="off" spellcheck="false"
             placeholder="· · · · · ·">
    </div>
    <div class="err" id="err"></div>
    <button class="btn" onclick="doLogin()">AUTHENTICATE</button>
    <p class="voice-note">
      🎤 <strong style="color:var(--text)">Voice Enablement:</strong> Open
      <code>chrome://flags</code> on your phone, search
      <code>Insecure origins treated as secure</code>, add your JARVIS URL, and tap Relaunch.
    </p>
  </div>

  <script>
    // Try auto-reconnect with stored device token (set on first QR login)
    (async function() {
      const devTok = localStorage.getItem('jarvis_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('jarvis_key', d.key);
          sessionStorage.setItem('jarvis_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      // Device token rejected (server restarted) — clear it and show normal form
      localStorage.removeItem('jarvis_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'Connection error';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('jarvis_key', key);
        sessionStorage.setItem('jarvis_token', data.token);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'Invalid or expired key';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>
</body>
</html>
