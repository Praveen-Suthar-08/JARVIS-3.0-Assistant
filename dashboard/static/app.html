<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS 3.0 — Cybernetic Command Center</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="/static/crypto.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      --bg:          #05070f;
      --bg-gradient: radial-gradient(circle at 50% 0%, #0d1527 0%, #05070f 75%);
      --surface:     rgba(15, 23, 42, 0.65);
      --surface-hover: rgba(30, 41, 59, 0.75);
      --border:      rgba(56, 189, 248, 0.18);
      --border-glow: rgba(0, 242, 254, 0.35);
      --accent:      #00f2fe;
      --accent-grad: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --accent-pink: linear-gradient(135deg, #ff0080 0%, #7928ca 100%);
      --adim:        rgba(0, 242, 254, 0.12);
      --text:        #f1f5f9;
      --muted:       #64748b;
      --green:       #10b981;
      --gdim:        rgba(16, 185, 129, 0.15);
      --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      background-image: var(--bg-gradient);
      color: var(--text);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(5, 7, 15, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      z-index: 10;
    }

    .logo {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .logo em {
      color: var(--accent);
      font-style: normal;
      -webkit-text-fill-color: initial;
      text-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px;
      border-radius: 99px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--muted);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pill.on {
      background: var(--gdim);
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--green);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }

    .pill.on .dot {
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: blink 1.8s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.85); }
    }

    .spacer { flex: 1; }

    .enc-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 4px 10px;
      border-radius: 6px;
      display: none;
      font-family: 'JetBrains Mono', monospace;
    }

    .enc-badge.on {
      display: block;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--green);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.15);
    }

    .enc-badge.off {
      display: block;
      background: rgba(248, 113, 113, 0.1);
      border: 1px solid rgba(248, 113, 113, 0.25);
      color: #f87171;
    }

    .url {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      padding: 5px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    /* ── FEED ── */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    main::-webkit-scrollbar { width: 5px; }
    main::-webkit-scrollbar-track { background: transparent; }
    main::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 4px; }
    main::-webkit-scrollbar-thumb:hover { background: rgba(0, 242, 254, 0.4); }

    .msg {
      max-width: 78%;
      padding: 13px 18px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.6;
      animation: pop 0.22s ease-out forwards;
      backdrop-filter: blur(12px);
      box-shadow: var(--card-shadow);
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .msg-j {
      align-self: flex-start;
      background: var(--adim);
      border: 1px solid var(--border-glow);
      border-bottom-left-radius: 4px;
      color: #e2e8f0;
      box-shadow: 0 4px 20px rgba(0, 242, 254, 0.08);
    }

    .msg-u {
      align-self: flex-end;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-bottom-right-radius: 4px;
      color: #ffffff;
    }

    .msg-sys {
      align-self: center;
      font-size: 11.5px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      padding: 4px 14px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 99px;
      letter-spacing: 0.5px;
    }

    .lbl {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 5px;
    }

    .msg-j .lbl { color: var(--accent); text-shadow: 0 0 8px var(--accent); }
    .msg-u .lbl { color: #94a3b8; text-align: right; }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      border-bottom-right-radius: 4px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 80%;
      animation: pop 0.22s ease-out;
      box-shadow: var(--card-shadow);
    }

    .fc-icon { font-size: 28px; flex-shrink: 0; }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl { font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
    .fc-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .fc-size { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
    .fc-bar-wrap { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 8px; overflow: hidden; }
    .fc-bar { height: 100%; width: 0%; background: var(--accent-grad); border-radius: 2px; transition: width 0.15s linear; }
    .fc-status { font-size: 11px; font-weight: 700; letter-spacing: 1px; flex-shrink: 0; color: var(--muted); }
    .fc-status.done { color: var(--green); }
    .fc-status.err { color: #f87171; }
    .fc-dl { display: inline-block; margin-top: 8px; font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 700; transition: opacity 0.2s; }
    .fc-dl:hover { opacity: 0.8; text-decoration: underline; }

    /* ── FOOTER ── */
    footer {
      flex-shrink: 0;
      padding: 16px 22px;
      border-top: 1px solid var(--border);
      background: rgba(5, 7, 15, 0.9);
      backdrop-filter: blur(20px);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #inp {
      flex: 1;
      padding: 13px 18px;
      background: rgba(15, 23, 42, 0.7);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit;
      outline: none;
      transition: all 0.25s ease;
      box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    #inp:focus {
      border-color: var(--accent);
      box-shadow: 0 0 18px rgba(0, 242, 254, 0.25), inset 0 2px 4px rgba(0, 0, 0, 0.2);
      background: rgba(15, 23, 42, 0.9);
    }

    #inp::placeholder { color: #475569; }

    .btn {
      padding: 13px 20px;
      border: none;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn:active { transform: scale(0.95); }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3); }

    .btn-send {
      background: var(--accent-grad);
      color: #05070f;
      font-weight: 800;
    }

    .btn-wake {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      display: none;
    }

    .btn-wake.show {
      display: block;
      color: var(--green);
      border-color: rgba(16, 185, 129, 0.4);
      background: var(--gdim);
    }

    .btn-attach, #mic-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 13px 15px;
      font-size: 18px;
      line-height: 1;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-attach:hover, #mic-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.25);
    }

    #mic-btn.recording {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.6);
      color: #ef4444;
      animation: mic-pulse 1s ease-in-out infinite;
      box-shadow: 0 0 18px rgba(239, 68, 68, 0.4);
    }

    @keyframes mic-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(0.95); }
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      top: 76px;
      left: 50%;
      transform: translateX(-50%) translateY(-10px);
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      backdrop-filter: blur(12px);
      color: var(--green);
      font-size: 12.5px;
      font-weight: 700;
      letter-spacing: 1.2px;
      padding: 8px 22px;
      border-radius: 99px;
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      white-space: nowrap;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
      z-index: 100;
    }

    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div id="toast"></div>
  <header>
    <div class="logo"><em>J</em>ARVIS <span>3.0</span></div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>
  <main id="feed"></main>
  <footer>
    <input id="inp" placeholder="Send a command to JARVIS…" autocomplete="off">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">SEND</button>
  </footer>

  <script>
    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('Remote session active.'); toast('Connected to JARVIS'); };
    ws.onclose   = () => sys('Connection lost — refresh to reconnect.');
    ws.onerror   = () => sys('Connection error.');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('Wake word detected — connecting…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Sleeping'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">Jarvis</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">You</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }

    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const encPayload = _encrypt(txt);
      if (encPayload) {
        ws.send(JSON.stringify({ type: 'text_encrypted', payload: encPayload }));
      } else {
        ws.send(JSON.stringify({ type: 'text', text: txt }));
      }
    }

    function doWake() {
      ws.send(JSON.stringify({ type: 'wake' }));
      toast('Wake signal sent');
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSend();
    });

    // ── Speech Recognition (Mic Button) ─────────────────────────────────────
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let _rec = null;
    const micBtn = document.getElementById('mic-btn');

    if (SpeechRec) {
      _rec = new SpeechRec();
      _rec.continuous    = false;
      _rec.interimResults = false;
      _rec.onstart  = () => micBtn.classList.add('recording');
      _rec.onend    = () => micBtn.classList.remove('recording');
      _rec.onerror  = () => micBtn.classList.remove('recording');
      _rec.onresult = (e) => {
        const text = e.results[0][0].transcript.trim();
        if (text) {
          document.getElementById('inp').value = text;
          doSend();
        }
      };
    } else {
      micBtn.classList.add('unsupported');
      micBtn.title = 'Web Speech API not supported in this browser';
    }

    function doMic() {
      if (!_rec) { toast('Speech recognition not available'); return; }
      if (micBtn.classList.contains('recording')) {
        _rec.stop();
      } else {
        _rec.start();
      }
    }

    // ── File Transfer ─────────────────────────────────────────────────────────
    document.getElementById('file-inp').addEventListener('change', (e) => {
      for (const f of e.target.files) _sendFile(f);
      e.target.value = '';
    });

    function _sendFile(file) {
      const cardId = 'fc-' + Math.random().toString(36).slice(2);
      _renderFileCard(cardId, file.name, file.size);

      const fd = new FormData();
      fd.append('file', file);

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (ev) => {
        if (ev.lengthComputable) {
          const pct = Math.round((ev.loaded / ev.total) * 100);
          _updateFileCard(cardId, pct, 'UPLOADING');
        }
      };

      xhr.onload = () => {
        if (xhr.status === 200) {
          _updateFileCard(cardId, 100, 'DONE', true);
          toast(`Sent ${file.name}`);
        } else {
          _updateFileCard(cardId, 0, 'FAILED', false, true);
        }
      };

      xhr.onerror = () => _updateFileCard(cardId, 0, 'ERROR', false, true);
      xhr.send(fd);
    }

    function _renderFileCard(id, name, size) {
      const ext = name.split('.').pop().toLowerCase();
      const icons = { pdf:'📄', png:'🖼️', jpg:'🖼️', jpeg:'🖼️', mp4:'🎬', mp3:'🎵', zip:'📦', py:'🐍' };
      const icon = icons[ext] || '📁';
      const sizeStr = size > 1048576 ? (size/1048576).toFixed(1)+' MB' : (size/1024).toFixed(0)+' KB';

      const d = document.createElement('div');
      d.className = 'msg-file';
      d.id = id;
      d.innerHTML = `
        <div class="fc-icon">${icon}</div>
        <div class="fc-meta">
          <div class="fc-lbl">Sending File</div>
          <div class="fc-name">${esc(name)}</div>
          <div class="fc-size">${sizeStr}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}-bar"></div></div>
        </div>
        <div class="fc-status" id="${id}-st">0%</div>
      `;
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function _updateFileCard(id, pct, statusText, isDone = false, isErr = false) {
      const bar = document.getElementById(`${id}-bar`);
      const st  = document.getElementById(`${id}-st`);
      if (bar) bar.style.width = pct + '%';
      if (st) {
        st.textContent = isDone ? 'SENT' : (isErr ? 'ERR' : pct + '%');
        if (isDone) st.className = 'fc-status done';
        if (isErr)  st.className = 'fc-status err';
      }
    }

    function _onFileReceived(m) {
      const d = document.createElement('div');
      d.className = 'msg msg-j';
      d.innerHTML = `
        <div class="lbl">Jarvis — File Received</div>
        <div>📁 <b>${esc(m.filename)}</b> (${(m.size/1024).toFixed(0)} KB)</div>
        <a class="fc-dl" href="/api/download/${encodeURIComponent(m.filename)}?token=${encodeURIComponent(_authToken)}" download>⬇ Download File</a>
      `;
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }
  </script>
</body>
</html>
